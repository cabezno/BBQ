# Deploy del servidor mínimo BBQ (directorio + señalización) en Render.
# Render sirve HTTPS y WebSocket gratis. Como server.js también sirve la app (www/),
# la misma URL de Render ES la app: abrila en el teléfono y "Agregar a pantalla de inicio".
services:
  - type: web
    name: bbq
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Persistencia del directorio (sin esto se borra en cada deploy). Se cargan a mano en Render.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # TURN para llamadas/P2P en redes que no conectan directo (opcional). Ver /api/ice-servers en server.js.
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
